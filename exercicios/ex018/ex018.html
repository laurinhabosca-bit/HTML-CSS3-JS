<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabuada Do 8</title>
</head>
<body>
    
    <script>
        const number = 8
        //i ++ -> i = i + 1
        for(let i = 1; i <= 10; i++) {
            //print
            console.log(i + "x" + number + "=" + number * i) }
    </script>

</body>
</html>
