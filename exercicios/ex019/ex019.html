<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funções em JavaScript</title>
</head>
<body>

    <button onclick="escreverNome()">Clique aqui</button>
    <button onclick="escreverNome()">Clique aqui também</button>

    <script>
        function escreverNome() {
            let nome = prompt("Digite seu nome:")
            alert("Nome: " + nome + " Bem - vindo(a)!")
        }
    </script>

</body>
</html>
